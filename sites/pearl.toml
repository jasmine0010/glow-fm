# Tropical Storm Arthur flood, Pearl River (LA/MS), Jun-Jul 2026. Held-out second event.
# Selection and settings fixed in research/SECOND_EVENT_PROTOCOL.md before any imagery was opened.

name = "pearl"
crs = "EPSG:32615"          # UTM 15N, the NISAR GCOV grid for these frames (checked from product metadata)
resolution_m = 50.0
bbox = [-89.95, 30.26, -89.62, 30.83]

[data]
root = "pearl"
dem = "dem/dem10m_utm16.tif"
gauges = "gauges"
operational = "ops"

[gcov]
"105A_20260703" = "NISAR_L2_PR_GCOV_024_105_A_017_4005_DHDH_A_20260703T111905_20260703T111940_P05023_N_F_J_001"
"105A_20260820" = "NISAR_L2_PR_GCOV_028_105_A_017_4005_DHDH_A_20260820T111903_20260820T111938_P05023_N_F_J_001"
"156D_20260625" = "NISAR_L2_PR_GCOV_023_156_D_073_4005_DHDH_A_20260625T004512_20260625T004547_P05023_N_F_J_001"
"156D_20260824" = "NISAR_L2_PR_GCOV_028_156_D_073_4005_DHDH_A_20260824T004509_20260824T004544_P05023_N_F_J_001"

[gunw]

# Primary (rule-selected) and secondary frozen pairs.
[pairs."105A_jul03"]
wet = "105A_20260703"
dry = "105A_20260820"
wet_time = "2026-07-03T11:19:05Z"
dry_time = "2026-08-20T11:19:03Z"

[pairs."156D_jun25"]
wet = "156D_20260625"
dry = "156D_20260824"
wet_time = "2026-06-25T00:45:12Z"
dry_time = "2026-08-24T00:45:09Z"

# West Pearl branch, upstream -> downstream. All datums are NAVD88 (no VDatum offset needed).
[[gauges]]
name = "Bogalusa"
id = "USGS-02489500"
lon = -89.8209
lat = 30.7933
datum_ft = 54.64
navd88_offset_ft = 0.0

[[gauges]]
name = "Pools Bluff"
id = "USGS-02490193"
lon = -89.8464
lat = 30.7058
datum_ft = 0.32
navd88_offset_ft = 0.0

[[gauges]]
name = "Pearl River LA"
id = "USGS-02492600"
lon = -89.7367
lat = 30.3852
datum_ft = -0.86
navd88_offset_ft = 0.0

[[gauges]]
name = "I-10 Slidell"
id = "USGS-02492700"
lon = -89.7022
lat = 30.2979
datum_ft = 0.33
navd88_offset_ft = 0.0

[valley]
# Coarse line through the gauges (protocol); re-centred on GFM reference water.
line = [[-89.8209, 30.7933], [-89.8464, 30.7058], [-89.7367, 30.3852], [-89.7022, 30.2979]]
corridor_m = 4000.0

[truth]
margin_m = 0.5
max_dry_height_m = 5.0

[split]
# Not used for the frozen evaluation (nothing is calibrated on this event).
calibration_max_chainage_m = 0.0
bootstrap_block_m = 2000.0

[detector]
forest_hv_db = -16.0
thresholds_db = [2.0]
